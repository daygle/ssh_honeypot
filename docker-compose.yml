services:
  daygle-ssh-honeypot:
    build: .
    container_name: daygle-ssh-honeypot
    restart: unless-stopped
    ports:
      # The honeypot owns port 22 - see README "Port 22 cutover" before starting.
      - "22:22"
      # Dashboard (put a reverse proxy + TLS in front for public access).
      - "8080:8080"
    environment:
      DATA_DIR: /data
      HONEYPOT_PORT: "22"
      WEB_PORT: "8080"
      # No "SSH-2.0-" prefix here - asyncssh adds it to the wire banner itself.
      # HONEYPOT_BANNER: "OpenSSH_9.6p1 Ubuntu-3ubuntu13"
    volumes:
      - daygle-data:/data
    # Hardening: the honeypot faces the internet, so keep it locked down.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  daygle-data:
