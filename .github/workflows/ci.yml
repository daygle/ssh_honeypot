name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set Up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run Tests
        run: python -m pytest -q

  docker:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Compose File
        run: docker compose config --quiet

      - name: Build Image
        run: docker build --tag daygle-ssh-honeypot:ci .

      - name: Smoke Test Container
        run: |
          docker run --detach --name smoke --publish 8080:8080 daygle-ssh-honeypot:ci
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8080/healthz > /dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8080/healthz
          curl --fail --silent http://127.0.0.1:8080/ | grep --quiet "Daygle SSH Honeypot"
          curl --fail --silent http://127.0.0.1:8080/ssh-blocklist.txt > /dev/null

      - name: Container Logs
        if: always()
        run: docker logs smoke

      - name: Cleanup
        if: always()
        run: docker rm --force smoke
