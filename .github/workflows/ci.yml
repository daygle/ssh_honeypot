name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run Tests
        run: python -m pytest -q

  docker:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Compose File
        run: docker compose config --quiet

      - name: Build Image
        run: docker build --tag daygle-ssh-honeypot:ci .

      - name: Smoke Test Container
        run: |
          docker run --detach --name smoke --publish 8080:8080 daygle-ssh-honeypot:ci
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8080/healthz > /dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8080/healthz

          # A fresh install redirects / to /setup until the one-time admin setup is
          # completed, so read the setup token from the database and finish setup so
          # the dashboard and blocklist are reachable and assertable. The password
          # meets the dashboard's minimum length (12).
          SETUP_KEY=$(docker exec smoke python -c 'import sqlite3; row=sqlite3.connect("/data/honeypot.db").execute("SELECT value FROM app_settings WHERE key=?", ("setup_token",)).fetchone(); print((row or (None,))[0] or "", end="")')
          curl --fail --silent --request POST \
            --header "Content-Type: application/x-www-form-urlencoded" \
            --data "username=admin&password=adminadminadmin1&password_confirm=adminadminadmin1&setup_key=$SETUP_KEY" \
            http://127.0.0.1:8080/setup

          # After setup the dashboard is protected by HTTP Basic auth.
          curl --fail --silent --user admin:adminadminadmin1 http://127.0.0.1:8080/ | grep --quiet "Daygle SSH Honeypot"
          curl --fail --silent --user admin:adminadminadmin1 http://127.0.0.1:8080/ssh-blocklist.txt > /dev/null

      - name: Container Logs
        if: always()
        run: docker logs smoke

      - name: Cleanup
        if: always()
        run: docker rm --force smoke
